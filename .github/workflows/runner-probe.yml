name: runner-probe

# Diagnostic: which hosted macOS labels actually allocate a runner on this
# account?  A job whose label matches no runner stays "queued" forever with
# runner_id 0 and zero steps -- exactly what the kernel/turnip builds showed.
on:
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        label:
          - macos-13
          - macos-14
          - macos-15
          - macos-latest
          - ubuntu-latest
    runs-on: ${{ matrix.label }}
    timeout-minutes: 5
    steps:
      - name: Report
        run: |
          echo "label=${{ matrix.label }}"
          uname -a
          sw_vers 2>/dev/null || true
          xcodebuild -version 2>/dev/null || true
